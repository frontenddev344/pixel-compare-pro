<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - Pixel Compare Pro</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Navigation -->
  <nav>
    <div class="nav-container">
      <div class="nav-logo">✨ Pixel Compare Pro</div>
      <ul class="nav-links">
        <li><a href="/dashboard">Dashboard</a></li>
        <li><a href="/comparison">New Comparison</a></li>
        <li><a href="/reports" class="active">Reports</a></li>
        <li><a href="/settings">Settings</a></li>
      </ul>
      <div class="nav-user">
        <div class="user-avatar" id="userAvatar">U</div>
        <button class="btn btn-small btn-secondary" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container" style="margin-top: 3rem; margin-bottom: 3rem;">
    <div class="flex-between" style="margin-bottom: 2rem;">
      <h2>Reports</h2>
      <a href="/comparison" class="btn btn-primary">New Comparison</a>
    </div>

    <!-- Search -->
    <div class="card" style="margin-bottom: 2rem;">
      <div class="form-group">
        <label for="searchInput">Search Reports</label>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search by title or URL..." 
        >
      </div>
    </div>

    <!-- Reports Table -->
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Reference URL</th>
            <th>Target URL</th>
            <th>Match Score</th>
            <th>Issues</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="reportsTable">
          <tr>
            <td colspan="7" class="text-center text-muted">Loading reports...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { API, UI, Auth, protectRoute } from '/app.js';

    // Protect route
    if (!(await protectRoute())) {
      window.location.href = '/';
    }

    const user = Auth.getUser();
    const userAvatar = document.getElementById('userAvatar');
    const logoutBtn = document.getElementById('logoutBtn');
    const searchInput = document.getElementById('searchInput');
    const reportsTable = document.getElementById('reportsTable');
    
    let allReports = [];

    // Set user avatar
    if (user) {
      const initials = (user.firstName[0] + user.lastName[0]).toUpperCase();
      userAvatar.textContent = initials;
    }

    // Logout
    logoutBtn.addEventListener('click', () => {
      Auth.logout();
    });

    // Load reports
    async function loadReports() {
      try {
        allReports = await API.getReports();
        renderReports(allReports);
      } catch (error) {
        UI.showAlert('Failed to load reports: ' + error.message, 'danger');
      }
    }

    // Render reports
    function renderReports(reports) {
      if (reports.length === 0) {
        reportsTable.innerHTML = `
          <tr>
            <td colspan="7" class="text-center text-muted">
              No reports yet. <a href="/comparison">Create a comparison</a> to generate reports.
            </td>
          </tr>
        `;
        return;
      }

      reportsTable.innerHTML = reports.map(report => `
        <tr>
          <td><strong>${report.title}</strong></td>
          <td class="text-muted">${UI.formatUrl(report.referenceUrl)}</td>
          <td class="text-muted">${UI.formatUrl(report.targetUrl)}</td>
          <td>
            <span class="text-accent" style="font-weight: 600;">
              ${Math.round(report.matchScore)}%
            </span>
          </td>
          <td class="text-muted">${report.issuesCount || 0}</td>
          <td class="text-muted">${UI.formatDate(report.createdAt)}</td>
          <td>
            <div class="flex" style="gap: 0.5rem; font-size: 0.875rem;">
              <button class="btn btn-small btn-secondary" onclick="downloadReport('${report.id}')">
                Download
              </button>
              <button class="btn btn-small btn-danger" onclick="deleteReport('${report.id}')">
                Delete
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    // Search reports
    searchInput.addEventListener('input', async (e) => {
      const query = e.target.value.trim();
      
      if (!query) {
        renderReports(allReports);
        return;
      }

      try {
        const results = await API.searchReports(query);
        renderReports(results);
      } catch (error) {
        UI.showAlert('Search failed: ' + error.message, 'danger');
      }
    });

    // Download report
    window.downloadReport = async (reportId) => {
      try {
        const report = await API.getReport(reportId);
        
        const content = {
          title: report.title,
          referenceUrl: report.referenceUrl,
          targetUrl: report.targetUrl,
          matchScore: report.matchScore,
          issuesCount: report.issuesCount,
          format: report.format,
          createdAt: report.createdAt
        };

        UI.downloadFile(
          JSON.stringify(content, null, 2),
          `report-${reportId}.json`,
          'application/json'
        );
        UI.showAlert('Report downloaded!', 'success');
      } catch (error) {
        UI.showAlert('Failed to download report: ' + error.message, 'danger');
      }
    };

    // Delete report
    window.deleteReport = async (reportId) => {
      if (!confirm('Are you sure you want to delete this report?')) return;

      try {
        await API.deleteReport(reportId);
        UI.showAlert('Report deleted', 'success');
        loadReports();
      } catch (error) {
        UI.showAlert('Failed to delete report: ' + error.message, 'danger');
      }
    };

    loadReports();
  </script>
</body>
</html>
